<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background subtle gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Border glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8" />
    </linearGradient>

    <!-- Core Aurora Bloom -->
    <radialGradient id="auroraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.55" />
      <stop offset="45%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>

    <!-- Signature Gemini Star Gradient -->
    <linearGradient id="geminiStarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Secondary Spark Gradient -->
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.2" />

  <!-- Ambient Light Disk -->
  <circle cx="32" cy="32" r="26" fill="url(#auroraGlow)" />

  <!-- Subtle Architecture Node Lines -->
  <path d="M 18,46 L 32,32 L 46,46" fill="none" stroke="#6366f1" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="2 2" />
  <circle cx="18" cy="46" r="2" fill="#38bdf8" opacity="0.7" />
  <circle cx="46" cy="46" r="2" fill="#c084fc" opacity="0.7" />

  <!-- Primary Gemini Star (Astroid Curve) -->
  <path 
    d="M 32,10 
       C 32,21.5 22.5,31 11,31 
       C 22.5,31 32,40.5 32,52 
       C 32,40.5 41.5,31 53,31 
       C 41.5,31 32,21.5 32,10 Z" 
    fill="url(#geminiStarGrad)" 
  />

  <!-- Secondary Satellite Spark -->
  <path 
    d="M 47,11 
       C 47,15.5 43.5,19 39,19 
       C 43.5,19 47,22.5 47,27 
       C 47,22.5 50.5,19 55,19 
       C 50.5,19 47,15.5 47,11 Z" 
    fill="url(#sparkGrad)" 
  />

  <!-- Core Brilliant Specular Light -->
  <circle cx="32" cy="31" r="2.2" fill="#ffffff" opacity="0.95" />
</svg>
